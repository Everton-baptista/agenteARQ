version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: pip
    directories:
      - /content/blueprints/*/app/none
      - /content/blueprints/*/app/langgraph
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      blueprint-runtime:
        patterns: ["*"]
        update-types: [minor, patch]
