name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write     # create the release
  id-token: write     # keyless signing via OIDC
  packages: write     # ghcr

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # goreleaser needs the history for the changelog

      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }

      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      # The gate runs on its own repository before anything ships. A release that has not
      # passed the standard it defines would be the clearest possible statement that the
      # standard is decorative.
      - name: the standard passes on itself
        run: |
          go build -o /tmp/agentarch ./cmd/agentarch
          /tmp/agentarch sync --check --targets agents_md,claude,gemini
          /tmp/agentarch validate examples/01-rag-support-agent
          /tmp/agentarch check --profile standard examples/01-rag-support-agent

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # OCI repository names must be lowercase, and the owner here is not. Computing it rather
      # than hardcoding keeps a fork working.
      - name: lowercase the owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/agentarch:${{ github.ref_name }}
            ghcr.io/${{ steps.owner.outputs.value }}/agentarch:latest

  # npm and PyPI need tokens this repository does not have yet. The jobs are here, disabled by
  # a guard rather than commented out, so that adding the secret is the only step — and so the
  # intent is reviewable rather than living in someone's notes.
  npm:
    runs-on: ubuntu-latest
    needs: release
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: publish the launcher and the platform packages
        run: bash scripts/publish-npm.sh "${{ github.ref_name }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    runs-on: ubuntu-latest
    needs: release
    if: ${{ vars.PUBLISH_PYPI == 'true' }}
    permissions:
      id-token: write   # trusted publishing: no long-lived token to leak
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: build the wheels
        run: bash scripts/build-wheels.sh "${{ github.ref_name }}"
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: dist-pypi/dist }
