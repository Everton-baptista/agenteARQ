name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write     # create the release
  id-token: write     # keyless signing via OIDC
  packages: write     # ghcr

jobs:
  preflight:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  security-preflight:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      actions: read
      security-events: write

  release:
    needs: [preflight, security-preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }   # goreleaser needs the history for the changelog

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod }

      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
        with: { cosign-release: v3.1.4 }
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with: { syft-version: v1.57.2 }

      # The gate runs on its own repository before anything ships. A release that has not
      # passed the standard it defines would be the clearest possible statement that the
      # standard is decorative.
      - name: the standard passes on itself
        run: |
          go build -o /tmp/agentarch ./cmd/agentarch
          /tmp/agentarch sync --check --targets agents_md,claude,gemini
          /tmp/agentarch validate examples/01-rag-support-agent
          /tmp/agentarch check --profile standard examples/01-rag-support-agent

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "v2.20.2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # OCI repository names must be lowercase, and the owner here is not. Computing it rather
      # than hardcoding keeps a fork working.
      - name: lowercase the owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/agentarch:${{ github.ref_name }}
            ghcr.io/${{ steps.owner.outputs.value }}/agentarch:latest

  # npm and PyPI need tokens this repository does not have yet. The jobs are here, disabled by
  # a guard rather than commented out, so that adding the secret is the only step — and so the
  # intent is reviewable rather than living in someone's notes.
  npm:
    runs-on: ubuntu-latest
    needs: release
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    permissions:
      contents: read
      # Two things ride on this. It lets npm authenticate by trusted publishing, so there is no
      # long-lived token sitting in a repository secret — the standing credential this project's
      # own 09-security.md argues against. And it signs each tarball with provenance, so anyone
      # can verify which workflow at which commit produced the binary they are running.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs a recent CLI; the one bundled with the Node image may predate it.
      - run: npm install -g npm@12.2.2
      - name: publish the launcher and the platform packages
        run: bash scripts/publish-npm.sh "${{ github.ref_name }}"
        env:
          # Bootstrap only. Trusted publishing is configured per package on npmjs.com, which is
          # awkward for names that do not exist yet — so the first release may need a granular
          # token, scoped to these packages and given a short expiry. Configure the trusted
          # publishers afterwards and delete it: an empty NODE_AUTH_TOKEN is the intended
          # steady state, not a misconfiguration.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    runs-on: ubuntu-latest
    needs: release
    if: ${{ vars.PUBLISH_PYPI == 'true' }}
    permissions:
      id-token: write   # trusted publishing: no long-lived token to leak
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: build the wheels
        run: bash scripts/build-wheels.sh "${{ github.ref_name }}"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with: { packages-dir: dist-pypi/dist }
