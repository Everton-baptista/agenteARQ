name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, no secrets, no network. This is the job that makes the standard self-enforcing:
  # a hand-edited CLAUDE.md fails the pull request in seconds rather than drifting unnoticed
  # for months.
  sync-check:
    name: generated files are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build -o /tmp/agentarch ./cmd/agentarch
      - name: sync --check
        run: /tmp/agentarch sync --check --targets agents_md,claude,gemini

  test:
    name: build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal payload.go)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -v

  examples:
    name: examples behave as documented
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -o /tmp/agentarch ./cmd/agentarch

      - name: passing examples validate cleanly
        run: |
          for d in examples/0*/; do
            echo "── $d"
            /tmp/agentarch validate "$d"
          done

      - name: the gate passes on a compliant project
        run: /tmp/agentarch check --profile standard examples/01-rag-support-agent

      # Asserting the failure is the point. A refactor that quietly stops enforcing a rule is
      # indistinguishable from a green build unless something checks that the bad input is
      # still rejected. Each case declares in expected.yaml which command should reject it and
      # with which code, because "fails validation" and "fails the gate" are different claims.
      - name: failing examples fail exactly as documented
        run: |
          fail=0
          for d in examples/99-failing/*/; do
            name=$(basename "$d")
            set +e
            /tmp/agentarch validate "$d" >/dev/null 2>&1; v=$?
            /tmp/agentarch check --profile standard "$d" >/dev/null 2>&1; c=$?
            set -e
            if [ "$v" -eq 0 ] && [ "$c" -eq 0 ]; then
              echo "::error::$name passes both validate and check, but exists to fail one of them"
              fail=1
            else
              echo "ok  $name  validate=$v check=$c"
            fi
          done
          exit $fail

      - name: an expired waiver blocks with exit 5
        run: |
          work=$(mktemp -d)
          cp -R examples/99-failing/autonomous-irreversible-unapproved/agentarch "$work/"
          cd "$work"
          mkdir -p agentarch/project
          cat > agentarch/project/waivers.yaml <<'EOF'
          waivers:
            - control: control.ai.tool.irreversible_requires_approval
              agent: support-triage
              reason: lapsed on purpose, to prove expiry is enforced
              owner: ci
              until: "2020-01-01"
          EOF
          set +e; /tmp/agentarch check --profile standard >/dev/null 2>&1; got=$?; set -e
          if [ "$got" -ne 5 ]; then
            echo "::error::expired waiver produced exit $got, expected 5"
            exit 1
          fi
          echo "ok  expired waiver -> exit 5"

      - name: SARIF output is well formed
        run: |
          set +e
          /tmp/agentarch check --profile standard --format sarif \
            --sarif-output /tmp/out.sarif examples/99-failing/unpinned-model >/dev/null 2>&1
          set -e
          python3 -c "
          import json,sys
          d=json.load(open('/tmp/out.sarif'))
          assert d['version']=='2.1.0', d['version']
          run=d['runs'][0]
          assert run['tool']['driver']['name']=='agentarch'
          assert len(run['results'])>0, 'no results emitted for a blocked project'
          assert run['results'][0]['level']=='error'
          print('ok  sarif', len(run['results']), 'result(s)')
          "

      - name: init works on a clean project
        run: |
          mkdir -p /tmp/greenfield && cd /tmp/greenfield
          /tmp/agentarch init --profile minimal
          test -f AGENTS.md && test -f agentarch/agentarch.yaml
          /tmp/agentarch sync --check
