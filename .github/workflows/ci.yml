name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, no secrets, no network. This is the job that makes the standard self-enforcing:
  # a hand-edited CLAUDE.md fails the pull request in seconds rather than drifting unnoticed
  # for months.
  sync-check:
    name: generated files are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build -o /tmp/agentarch ./cmd/agentarch
      - name: sync --check
        run: /tmp/agentarch sync --check --targets agents_md,claude,gemini

  test:
    name: build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal payload.go)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -v

  examples:
    name: examples behave as documented
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -o /tmp/agentarch ./cmd/agentarch

      - name: passing examples validate cleanly
        run: |
          for d in examples/0*/; do
            echo "── $d"
            /tmp/agentarch validate "$d"
          done

      - name: the gate passes on a compliant project
        run: /tmp/agentarch check --profile standard examples/01-rag-support-agent

      # Asserting the failure is the point. A refactor that quietly stops enforcing a rule is
      # indistinguishable from a green build unless something checks that the bad input is
      # still rejected. Each case declares in expected.yaml which command should reject it and
      # with which code, because "fails validation" and "fails the gate" are different claims.
      - name: failing examples fail exactly as documented
        run: |
          fail=0
          for d in examples/99-failing/*/; do
            name=$(basename "$d")
            set +e
            /tmp/agentarch validate "$d" >/dev/null 2>&1; v=$?
            /tmp/agentarch check --profile standard "$d" >/dev/null 2>&1; c=$?
            set -e
            if [ "$v" -eq 0 ] && [ "$c" -eq 0 ]; then
              echo "::error::$name passes both validate and check, but exists to fail one of them"
              fail=1
            else
              echo "ok  $name  validate=$v check=$c"
            fi
          done
          exit $fail

      - name: an expired waiver blocks with exit 5
        run: |
          work=$(mktemp -d)
          cp -R examples/99-failing/autonomous-irreversible-unapproved/agentarch "$work/"
          cd "$work"
          mkdir -p agentarch/project
          cat > agentarch/project/waivers.yaml <<'EOF'
          waivers:
            - control: control.ai.tool.irreversible_requires_approval
              agent: support-triage
              reason: lapsed on purpose, to prove expiry is enforced
              owner: ci
              until: "2020-01-01"
          EOF
          set +e; /tmp/agentarch check --profile standard >/dev/null 2>&1; got=$?; set -e
          if [ "$got" -ne 5 ]; then
            echo "::error::expired waiver produced exit $got, expected 5"
            exit 1
          fi
          echo "ok  expired waiver -> exit 5"

      - name: SARIF output is well formed
        run: |
          set +e
          /tmp/agentarch check --profile standard --format sarif \
            --sarif-output /tmp/out.sarif examples/99-failing/unpinned-model >/dev/null 2>&1
          set -e
          python3 -c "
          import json,sys
          d=json.load(open('/tmp/out.sarif'))
          assert d['version']=='2.1.0', d['version']
          run=d['runs'][0]
          assert run['tool']['driver']['name']=='agentarch'
          assert len(run['results'])>0, 'no results emitted for a blocked project'
          assert run['results'][0]['level']=='error'
          print('ok  sarif', len(run['results']), 'result(s)')
          "

      - name: the reference example reaches L3
        run: |
          out=$(/tmp/agentarch conformance --profile standard examples/01-rag-support-agent)
          echo "$out"
          echo "$out" | grep -q "conformance: L3" || {
            echo "::error::the reference example must demonstrate L3, or the level is theory"; exit 1; }
          echo "$out" | grep -q "valid until" || {
            echo "::error::an L3 assessment must carry an expiry"; exit 1; }

      - name: translations are not stale
        run: /tmp/agentarch validate --strict-i18n examples/01-rag-support-agent

      - name: the pt-BR core renders within budget
        run: |
          work=$(mktemp -d) && cd "$work"
          /tmp/agentarch init --lang pt-BR --profile standard
          grep -q "Regras de arquitetura de agentes" CLAUDE.md
          grep -q "source_sha256" CLAUDE.md && {
            echo "::error::translation front matter leaked into the shim; it spends context budget"; exit 1; }
          /tmp/agentarch sync --check --lang pt-BR
          echo "ok  pt-BR core renders clean"

      # A skill with no checklist means the standard works better in assistants that load
      # skills, which contradicts the promise on its own front page.
      - name: skills and checklists stay in parity
        run: |
          work=$(mktemp -d) && cd "$work"
          /tmp/agentarch init --profile standard >/dev/null
          /tmp/agentarch sync --targets skills
          test -f .claude/skills/agentarch-new-agent/SKILL.md
          test -f agentarch/std/checklists/new-agent.md
          for s in agentarch/std/skills/*/; do
            short=$(basename "$s" | sed 's/^agentarch-//')
            test -f "agentarch/std/checklists/$short.md" || {
              echo "::error::skill $short has no checklist"; exit 1; }
          done
          # The scripts a skill drives must at least parse.
          for f in $(find agentarch/std/skills -name '*.py'); do
            python3 -c "import ast; ast.parse(open('$f').read())"
          done
          /tmp/agentarch sync --check --targets skills
          echo "ok  skills and checklists in parity, scripts parse"

      - name: the shipped registry verifies
        run: /tmp/agentarch pack verify

      - name: the core names no framework
        run: |
          # AA-FWK-014 runs inside validate. Without it, "framework-neutral core" is a claim
          # nobody checks, and an example creeps into a standard within two releases.
          /tmp/agentarch validate examples/01-rag-support-agent

      - name: every pack resolves and every control it names exists
        run: /tmp/agentarch pack list --installed

      - name: the AI-BOM generates from the manifests
        run: |
          /tmp/agentarch aibom --root examples/01-rag-support-agent --out /tmp/ai-bom.json
          python3 -c "
          import json
          d=json.load(open('/tmp/ai-bom.json'))
          a=d['agents'][0]
          kinds={c['type'] for c in a['components']}
          for want in ('model','prompt','corpus','tool','mcp_server'):
              assert want in kinds, f'AI-BOM is missing {want}; an SBOM already covers packages'
          print('ok  ai-bom', len(a['components']), 'components')
          "

      # The onboarding path is the most-used code path in the project and the easiest to break
      # without noticing, because nobody runs it twice.
      - name: a new user can go from nothing to a passing gate
        run: |
          work=$(mktemp -d) && cd "$work"
          /tmp/agentarch init --profile standard --jurisdictions EU,BR
          test -f AGENTS.md && test -f agentarch/agentarch.yaml
          test -f agentarch/std/LOCK.json
          /tmp/agentarch sync --check

          /tmp/agentarch new agent customer-triage
          test -f agentarch/project/agents/customer-triage/agent.yaml
          grep -q '"EU", "BR"' agentarch/project/agents/customer-triage/agent.yaml

          # The scaffold must fail validation on the TODOs, and only on the TODOs.
          set +e; /tmp/agentarch validate >/dev/null 2>&1; got=$?; set -e
          [ "$got" -eq 2 ] || { echo "::error::a fresh scaffold should fail validate, got $got"; exit 1; }

          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("agentarch/project/agents/customer-triage/agent.yaml"); s = p.read_text()
          for a, b in [("    accountable: TODO", "    accountable: a.person"),
                       ("    team: TODO", "    team: t"),
                       ("    contact: TODO@example.com", "    contact: t@example.com"),
                       ("  purpose: TODO", "  purpose: Answers questions and escalates the rest."),
                       ("  out_of_scope:\n    - TODO", "  out_of_scope:\n    - Never issues refunds"),
                       ("    stop_conditions:\n      - TODO", "    stop_conditions:\n      - Answer delivered"),
                       ("    provider: TODO", "    provider: anthropic"),
                       ("    id: TODO", "    id: claude-sonnet-4-5-20250929")]:
              s = s.replace(a, b)
          p.write_text(s)
          PY

          /tmp/agentarch validate
          /tmp/agentarch check --profile standard
          echo "ok  nothing -> passing gate"

      # A blueprint that does not install clean and pass the gate is a starting point that
      # starts you in a hole. This is the promise the whole feature rests on.
      - name: every blueprint installs clean and passes the gate
        run: |
          for bp in $(/tmp/agentarch blueprint list --format ids); do
            work=$(mktemp -d)
            (cd "$work"
             /tmp/agentarch init --profile standard >/dev/null
             /tmp/agentarch blueprint add "$bp" --yes >/dev/null
             /tmp/agentarch validate
             /tmp/agentarch check --profile standard >/dev/null
             test -f app/agent.py && test -f app/README.md
             python3 -c "import ast,sys; ast.parse(open('app/agent.py').read())"
             echo "ok  $bp installs, validates, passes the gate, and parses")
          done

      - name: a blueprint refuses to overwrite existing work
        run: |
          work=$(mktemp -d) && cd "$work"
          /tmp/agentarch init --profile standard >/dev/null
          /tmp/agentarch blueprint add rag-support --yes >/dev/null
          set +e; /tmp/agentarch blueprint add rag-support --yes >/dev/null 2>&1; got=$?; set -e
          [ "$got" -eq 2 ] || { echo "::error::a second install should refuse, got $got"; exit 1; }
          echo "ok  refuses to overwrite"

      # A project with existing agents fails on day one. Without a way in that costs nothing
      # that day, the gate is switched off and nothing improves. This is that way in, and the
      # ratchet must only ever turn one direction.
      - name: a legacy project can adopt without switching the gate off
        run: |
          work=$(mktemp -d) && cd "$work"
          mkdir -p src
          cat > src/bot.py <<'PY'
          from anthropic import Anthropic
          SYSTEM = "You are a helpful assistant for internal tools."
          PY

          /tmp/agentarch init --adopt --profile standard >/dev/null
          test -f agentarch/project/agents/*/agent.yaml || {
            echo "::error::adopt scaffolded nothing"; exit 1; }
          grep -rq "unknown" agentarch/project/agents/*/agent.yaml || {
            echo "::error::adopt should leave what it cannot determine as unknown"; exit 1; }

          python3 - <<'PY'
          import glob, pathlib
          p = pathlib.Path(glob.glob("agentarch/project/agents/*/agent.yaml")[0])
          s = p.read_text()
          s = s.replace("accountable: unknown      #", "accountable: a.person  #")
          s = s.replace("  purpose: unknown", "  purpose: Answers questions about internal tools.")
          s = s.replace("    - unknown                 # the three", "    - Never runs a destructive query  #")
          s = s.replace("      - unknown\n", "      - Answer delivered\n")
          s = s.replace("sha256: unknown", 'sha256: "' + "0"*64 + '"')
          p.write_text(s)
          PY

          set +e; /tmp/agentarch check --profile standard >/dev/null 2>&1; before=$?; set -e
          [ "$before" -eq 4 ] || { echo "::error::a legacy project should fail before adopting, got $before"; exit 1; }

          /tmp/agentarch check --profile standard --adopt-baseline >/dev/null
          test -f agentarch/project/baseline.json

          /tmp/agentarch check --profile standard >/dev/null
          echo "ok  baselined failures no longer block"

          # The ratchet turns one way: a new agent's failures were never baselined.
          cp -R agentarch/project/agents/* /tmp/newagent-src 2>/dev/null || true
          d=$(ls -d agentarch/project/agents/*/ | head -1)
          cp -R "$d" agentarch/project/agents/brand-new
          sed -i 's/^  id: .*/  id: brand-new/' agentarch/project/agents/brand-new/agent.yaml
          set +e; /tmp/agentarch check --profile standard >/dev/null 2>&1; after=$?; set -e
          [ "$after" -eq 4 ] || { echo "::error::a new agent's failures must still block, got $after"; exit 1; }
          echo "ok  the ratchet only turns one way"

      - name: upgrade tells a local edit apart from an upstream change
        run: |
          work=$(mktemp -d) && cd "$work"
          /tmp/agentarch init --profile minimal >/dev/null

          # An untouched install must upgrade cleanly, whatever the payload now contains.
          /tmp/agentarch upgrade >/dev/null
          echo "ok  clean upgrade"

          # An edited vendored file must be reported rather than silently overwritten.
          echo "# local edit" >> agentarch/std/core/en/10-invariants.md
          set +e; /tmp/agentarch upgrade >/dev/null 2>&1; got=$?; set -e
          [ "$got" -eq 2 ] || { echo "::error::an edited vendored file should block upgrade, got $got"; exit 1; }
          echo "ok  local edit detected"

      - name: new tool scaffolds an approval block for an irreversible effect
        run: |
          work=$(mktemp -d) && cd "$work"
          /tmp/agentarch init --profile minimal >/dev/null
          /tmp/agentarch new tool delete_account --effect irreversible >/dev/null
          grep -q "on_timeout: deny" agentarch/project/tools/delete_account.tool.yaml
          grep -q "sandbox: container" agentarch/project/tools/delete_account.tool.yaml
          echo "ok  irreversible tool scaffolds its approval"
