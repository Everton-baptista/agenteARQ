# PyPI distribution, following the pattern ruff and maturin-built tools use: a wheel per
# platform carrying the binary, so `pipx install agentarch` needs no compiler and no Go.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentarch"
dynamic = ["version"]
description = "An open, versioned, verifiable standard for building AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
keywords = ["ai", "agents", "llm", "guardrails", "mcp", "governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/Everton-baptista/agenteARQ"
Source = "https://github.com/Everton-baptista/agenteARQ"
Specification = "https://github.com/Everton-baptista/agenteARQ/tree/main/spec"

[project.scripts]
agentarch = "agentarch.__main__:main"

[tool.hatch.version]
path = "agentarch/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["agentarch"]
