# This example MUST fail — at the gate, not at validation.
#
# Note the boundary this case exists to pin down: `validate` passes here on purpose.
# The schema governs structure, and `pinned` is a boolean that is present and well formed.
# Whether an unpinned model is *allowed* is policy, and policy lives in a pack. A prototype
# may legitimately float; a production agent may not. Encoding that judgement into the
# schema would make the standard un-adoptable for early-stage work, which is how a standard
# ends up being ignored rather than adopted incrementally.
case: unpinned-model
artifact: agent.yaml
kind: agent
phase: 2
expect:
  validate:
    exit_code: 0
    reason: "Structurally valid: `pinned: false` is a well-formed boolean."
  check:
    exit_code: 4
    profile: standard
    control: control.ai.supply.model_pinned
    severity: blocker
    reason: >-
      The model is not pinned, so behaviour can change with no diff, no review and no
      revalidation trigger — which silently invalidates every eval result and threat model
      downstream. Invariant 7.
    remediation: >-
      Set model.pinned to true and use an immutable model identifier, or waive with a named
      owner and an expiry date if this is deliberately a prototype.
