# This example MUST fail `sync --check` with exit 3 — drift, not a gate block. The distinction is the
# whole reason the exit codes are distinct: "you forgot to regenerate a file" and "your agent is
# unsafe" call for different responses from CI and from the person reading the failure.
#
# The shape of the drift is the realistic one. Somebody added an endpoint to the JSON because it was
# faster than editing the manifest, and the added route is unauthenticated. The reviewed document no
# longer describes what consumers are told exists — which is the failure mode that makes generating
# the contract worth doing at all rather than maintaining two copies.
case: contract-out-of-sync
artifact: contracts/openapi.json
kind: generated
expect:
  phase: 2
  validate:
    exit_code: 0
    reason: Every artifact is structurally valid; the generated file is simply stale.
  check:
    exit_code: 0
    reason: >-
      Drift is not a gate failure. `sync --check` exits 3, and the exit codes are distinct precisely
      so that "you forgot to regenerate a file" and "your agent is unsafe" call for different
      responses from CI and from the person reading the failure.
  sync:
    exit_code: 3
    reason: >-
      contracts/openapi.json describes a route the manifest does not declare, and records a source
      digest that matches nothing. Run `agentarch sync`; never edit the generated file.
