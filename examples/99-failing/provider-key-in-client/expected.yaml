# This example MUST fail, immediately and without grace, for the same reason as committed-env-file:
# the credential has already been served to every visitor.
#
# The second failure matters as much as the first and is easier to miss. Even with a key that is
# somehow safe, a browser calling the provider directly bypasses every guardrail in the standard.
# The prompt-injection check, the output check, tool authorisation, the per-caller budget and the
# audit trail are all server-side, and a client that talks to the provider has none of them. It is
# an unmetered proxy to your account with your users' names on it.
case: provider-key-in-client
artifact: web/chat.ts
kind: repository
# It fails twice, independently, and that is the intended design rather than a duplication. The lint
# reports it structurally at validate time (exit 2); the gate blocks it (exit 4). Two mechanisms for
# the one failure that cannot be walked back — a credential that has already been served.
expect:
  phase: 2
  validate:
    exit_code: 2
    finding: AA-DEP-019
    reason: >-
      It fails twice, independently, and that is the design rather than a duplication. The lint
      reports it structurally here; the gate blocks it below. Two mechanisms for the one failure that
      cannot be walked back — a credential that has already been served to every visitor.
  check:
    exit_code: 4
    profile: standard
    control: control.ai.api.no_client_side_model_access
    severity: blocker
    reason: >-
      Even with a key that were somehow safe, a browser calling the provider bypasses every guardrail
      in the standard: the injection check, the output check, tool authorisation, the per-caller
      budget and the audit trail are all server-side. It is an unmetered proxy to your account with
      your users' names on it.
