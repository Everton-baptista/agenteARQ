# This example MUST fail, and with no grace period.
#
# Every other control in api.edge enters in warn mode so that nothing which passes today starts
# failing on upgrade. This one does not, because it does not describe a risk — it describes a
# credential that is already public. A grace period on "your API key is in the repository" is not a
# kindness, it is a delay before somebody else finds it.
#
# There is no .gitignore here on purpose. The blueprints ship one, and the point of this case is what
# happens to a project that does not: `git add -A` on a day somebody is in a hurry, and the value
# outlives every commit that later removes it.
case: committed-env-file
artifact: .env
kind: repository
expect:
  phase: 2
  validate:
    exit_code: 0
    reason: >-
      Every artifact is structurally valid. The defect is a file in the repository, not a field in a
      manifest — which is why the gate computes repository facts and the control reads them, rather
      than a pack walking the filesystem itself.
  check:
    exit_code: 4
    profile: standard
    control: control.ai.api.secrets_not_committed
    severity: blocker
    reason: >-
      A tracked .env carries a provider credential by value. Invariant 3 says a secret is referenced
      by name and never carried by value, and this is the way that breaks most often. The fix begins
      with rotating the key, because deleting the file does not un-publish it.
