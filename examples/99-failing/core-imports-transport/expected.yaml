# This example MUST fail validation, not the gate — the two are different claims and CI routes them
# differently. AA-DEP-019 is a structural finding about the code's shape; the gate is about declared
# policy.
#
# It also demonstrates why the control is written against the dependency direction rather than against
# directory names. Nothing here is misplaced: runner.py is in app/agent, deps.py is in app/api, both
# exactly where they belong. The defect is the arrow between them, which is invisible to any check
# that only looks at where files live.
#
# When control.ai.api.core_transport_separated leaves its grace period — at api.edge 1.2, which is
# this pack's own version and not content/VERSION — the finding is reported at major severity. The
# gate still exits 0: only blockers block, which is what keeps a severity rise from switching CI off.
case: core-imports-transport
artifact: app/agent/runner.py
kind: code
expect:
  phase: 0
  validate:
    exit_code: 2
    finding: AA-DEP-019
    reason: >-
      The agent core imports both the web framework and a module under layout.paths.edge. Either
      alone means the loop can only run inside a web server; together they mean the agent and the
      transport have become one thing.
  check:
    exit_code: 0
    reason: >-
      Not a gate failure yet. control.ai.api.core_transport_separated is in its grace period until
      api.edge 1.2, because a project that grew the agent inside its route handlers has to move code —
      which is the point of the control and the reason it warns first.
