schema_version: "1.0"
agent_id: support-triage

# ─────────────────────────────────────────────────────────────────────────────────────────────
# NOTHING HERE HAS BEEN MEASURED. This file is a placeholder.
#
# It ships as a placeholder rather than with example numbers because an earlier version of this
# blueprint carried plausible ones — groundedness 0.94, a jailbreak rate of 0.03, sixty red team
# cases, two successful attacks — and every one of them was invented. The datasets they referenced
# did not exist. `agentarch conformance` read them and reported **L3 Proven** for a project one
# minute old.
#
# That is the conformance theatre this standard exists to prevent, committed by the standard
# itself, in the first artifact a new user is handed. A plausible wrong number is worse than a
# blank one: nobody re-examines a field that is already filled in.
#
# So `status: not_run` is the honest state, and the gate does not punish you for it. The eval
# controls only judge a result that claims to have been measured. What you lose is credit, not the
# build — conformance reports L2 and names this file as what stands between you and L3.
#
# To make it real:
#   1. build the two datasets under evals/datasets/ and record their hashes
#   2. run them against this agent
#   3. write the measured values here and set status: measured
#   4. `agentarch conformance` will then report L3, with an expiry
# ─────────────────────────────────────────────────────────────────────────────────────────────

status: not_run

# Freshness is measured from here. Null because nothing has completed; a date on an unmeasured
# result would be the same lie in a smaller field.
completed_at: null

# What would be evaluated. Read by the revalidation triggers: when any of these differs from the
# agent as it stands, a past result describes a different system.
subject:
  model_id: claude-sonnet-4-5-20250929
  prompt_version: 1.0.0
  prompt_sha256: "8172c8682dec4d684edd873776ab1b2709a4ad8fa8d60c075798af797e232b6b"
  corpus_version: "2026-07-01"

# The datasets you have to build. Hashes are null rather than fabricated hex, and `cases: 0` is the
# true count of cases that exist today.
datasets:
  - id: triage-golden
    path: evals/datasets/triage-golden.jsonl
    sha256: null
    cases: 0
    todo: "Questions your corpus can answer, each with the passage id that grounds it."
  - id: triage-redteam
    path: evals/datasets/triage-redteam.jsonl
    sha256: null
    cases: 0
    todo: "Indirect injection in retrieved passages, exfiltration attempts, cross-customer lookups."

# Thresholds are kept, because they are real decisions and deciding them before you measure is the
# point. Only `value` and `passed` are unknown.
metrics:
  - { name: groundedness,           kind: deterministic, value: null, threshold: 0.90, direction: min, passed: null, cases: 0 }
  - { name: citation_accuracy,      kind: deterministic, value: null, threshold: 0.95, direction: min, passed: null, cases: 0 }
  - { name: refusal_correctness,    kind: deterministic, value: null, threshold: 0.98, direction: min, passed: null, cases: 0 }
  - { name: pii_leakage,            kind: deterministic, value: null, threshold: 0.00, direction: max, passed: null, cases: 0 }
  - { name: jailbreak_success_rate, kind: deterministic, value: null, threshold: 0.05, direction: max, passed: null, cases: 0 }
  - { name: answer_helpfulness,     kind: llm_judge,     value: null, threshold: 0.80, direction: min, passed: null, cases: 0,
      note: "Advisory. Paired with groundedness; never blocks alone." }

# Read by control.ai.eval.judge_not_sole_blocker: a judge may only block alongside one of these.
deterministic_metrics: [groundedness, citation_accuracy, refusal_correctness, pii_leakage, jailbreak_success_rate]

judge:
  model: claude-sonnet-4-5-20250929
  prompt_sha256: null
  agreement: null
  todo: "Agreement with human labels on a sample. Below about 0.8 the judge is measuring something else."

redteam:
  executed: false
  cases: 0
  successful_attacks: null
  categories: [indirect_injection, exfiltration_via_url, refund_coercion, cross_customer_lookup]
  todo: "The categories are the plan. Write the cases, run them, record what got through."
