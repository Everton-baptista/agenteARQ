schema_version: "1.0"
tool:
  id: search_orders
  description_for_model: >-
    Look up orders belonging to the currently authenticated customer. Returns order id,
    status, carrier and estimated delivery. Does not modify anything.
  description_for_humans: >-
    Read-only order lookup, scoped server-side to the authenticated customer. The customer
    id is never taken from model output.

  input_schema:
    type: object
    required: [order_reference]
    additionalProperties: false
    properties:
      order_reference:
        type: string
        pattern: "^[A-Z0-9-]{6,20}$"

  output_schema:
    type: object
    required: [orders]
    properties:
      orders:
        type: array
        items:
          type: object
          properties:
            order_id: { type: string }
            status: { type: string }
            carrier: { type: string }
            eta: { type: string }

  effect: read
  idempotency:
    idempotent: true

  permissions:
    scopes: ["orders:read"]
    data_access: ["orders", "shipments"]
    network:
      deny_by_default: true
      egress: ["orders-api.internal.example.com"]
    filesystem:
      read: []
      write: []
    secrets: ["ORDERS_API_TOKEN"]
    sandbox: subprocess

  limits:
    timeout_ms: 3000
    max_retries: 2
    rate_limit_rpm: 60

  failure:
    on_timeout: fail_warn
    on_error: fail_warn

  owner: team-orders
  tests:
    - tests/tools/test_search_orders.py
