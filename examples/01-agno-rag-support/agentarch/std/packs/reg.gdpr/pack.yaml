schema_version: "1.0"
pack:
  id: reg.gdpr
  version: 1.0.0
  title: GDPR — operational controls for AI systems processing personal data
  description: >-
    The subset of GDPR obligations that an agent's manifest can actually evidence: a declared
    lawful basis, data minimisation, a retention period, and telemetry that does not quietly
    become a second copy of everything a user typed.

    This pack does not make a project GDPR compliant and does not claim to. Compliance is a
    legal assessment about an organisation; these are the engineering preconditions without
    which that assessment cannot be favourable.

  authority_status: binding_law
  authority:
    name: General Data Protection Regulation
    reference: "Regulation (EU) 2016/679"
    jurisdiction: [EU]
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
  reviewed_at: "2026-07-28"

  applies_when:
    jurisdictions: [EU]
    processes_personal_data: true

  requires:
    - control: control.ai.privacy.retention_declared
      severity: blocker
      required_evidence: [manifest_field]
      note: >-
        Storage limitation, Art. 5(1)(e). Data with no stated retention is kept forever by
        default, which is the outcome nobody chose and the one hardest to defend.

    - control: control.ai.privacy.capture_content_default_off
      severity: blocker
      required_evidence: [manifest_field]
      note: >-
        Data minimisation, Art. 5(1)(c). Content capture turns an observability pipeline into a
        copy of everything users typed, in systems with different retention and access rules
        from the ones that were assessed.

    - control: control.ai.agent.secrets_by_reference
      severity: blocker
      required_evidence: [tool_spec, scan_result]

    - control: control.ai.genai.output_guardrail
      severity: blocker
      required_evidence: [manifest_field, eval_result]
      note: Integrity and confidentiality, Art. 5(1)(f) — an output filter is where leakage is caught.

    - control: control.ai.agent.owner_defined
      severity: blocker
      required_evidence: [manifest_field]
      note: Accountability, Art. 5(2). Someone has to be able to demonstrate compliance.
