schema_version: "1.0"
pack:
  id: core.agent
  version: 1.0.0
  title: Core agent contract
  description: >-
    The minimum an agent must declare to be reviewable at all: who is accountable, what it
    refuses, how far it may go alone, and that its loop terminates. Present in every profile.
    Nothing here is specific to a framework, a provider or a jurisdiction.

  authority_status: best_practice
  authority:
    name: agentarch
    reference: content/standards/en/01-agent-contract.md
    jurisdiction: ["*"]
  reviewed_at: "2026-07-28"

  requires:
    - control: control.ai.agent.owner_defined
      severity: blocker
      required_evidence: [manifest_field]

    - control: control.ai.agent.scope_declared
      severity: blocker
      required_evidence: [manifest_field]

    - control: control.ai.agent.autonomy_declared
      severity: blocker
      required_evidence: [manifest_field]

    - control: control.ai.agent.stop_conditions
      severity: blocker
      required_evidence: [manifest_field]

    - control: control.ai.agent.fail_mode_declared
      severity: blocker
      required_evidence: [manifest_field]

    - control: control.ai.tool.contract_declared
      severity: blocker
      required_evidence: [tool_spec]

    - control: control.ai.tool.effect_classified
      severity: blocker
      required_evidence: [tool_spec]

    # The pack's load-bearing rule: it rests on the tool spec, not on a box someone ticked.
    - control: control.ai.tool.irreversible_requires_approval
      severity: blocker
      required_evidence: [tool_spec]

    - control: control.ai.agent.budget_bounded
      severity: major
      required_evidence: [manifest_field]
      note: >-
        Major rather than blocker because a declared budget is a declaration until something
        measures against it. It becomes meaningful once obs.otel is adopted.

    - control: control.ai.tool.idempotency_declared
      severity: major
      required_evidence: [tool_spec]

    - control: control.ai.tool.timeout_declared
      severity: major
      required_evidence: [tool_spec]

    - control: control.ai.genai.prompt_versioned
      severity: major
      enforced_from: 1.1.0
      required_evidence: [manifest_field, file_hash]
      note: >-
        Runs in warn mode until pack 1.1.0. Existing projects need a release to record hashes
        for prompts that already exist; blocking on day one would simply get the gate disabled.
