schema_version: "1.0"
control:
  id: "control.ai.genai.input_guardrail"
  type: "genai"
  title: "User input is screened before it reaches the model"
  intent: "Injection screening is probabilistic and will be evaded; its job is to raise cost and catch the unsophisticated case."
  status: "stable"
  check: 
    kind: "static_manifest"
    expr: "len(agent.guardrails.input) >= 1"
    message: "No input guardrail is declared."
  evidence: 
    - "manifest_field"
    - "eval_result"
  remediation: "Add at minimum prompt-injection screening and a length bound. This does not replace content isolation or tool least privilege."
  standard_ref: "standards/08-guardrails.md#controlaigenaiinput_guardrail"
  references: 
    - "OWASP LLM01"
