schema_version: "1.0"
control:
  id: "control.ai.tool.timeout_declared"
  type: "tool"
  title: "Every tool bounds how long it can hang"
  intent: "Timeouts cascade: a tool timeout above the agent's latency budget makes that budget fiction."
  status: "stable"
  check: 
    kind: "static_manifest"
    expr: "all(tools[].tool.limits.timeout_ms > 0)"
    message: "A tool has no timeout."
  evidence: 
    - "tool_spec"
  remediation: "Set limits.timeout_ms comfortably below the agent's latency_p95_ms budget."
  standard_ref: "standards/03-tools.md#controlaitooltimeout_declared"
  references: 
    - "OWASP LLM10"
