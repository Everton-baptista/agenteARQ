schema_version: "1.0"
control:
  id: "control.ai.tool.idempotency_declared"
  type: "tool"
  title: "Every tool declares whether retrying is safe"
  intent: "Agents retry on timeout. A non-idempotent tool without an idempotency key turns one intended refund into three."
  status: "stable"
  check: 
    kind: "static_manifest"
    expr: "all(exists(tools[].tool.idempotency.idempotent))"
    message: "A tool does not declare its idempotency."
  evidence: 
    - "tool_spec"
  remediation: "Declare idempotent, and when it is false name the input field carrying the idempotency key."
  standard_ref: "standards/03-tools.md#controlaitoolidempotency_declared"
  references: 
    - "NIST AI RMF MANAGE 2.3"
