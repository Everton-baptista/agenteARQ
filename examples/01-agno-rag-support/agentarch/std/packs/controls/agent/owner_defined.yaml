schema_version: "1.0"
control:
  id: "control.ai.agent.owner_defined"
  type: "agent"
  title: "Every agent names an accountable person"
  intent: "Without a named individual, nobody decides whether to disable a misbehaving agent, and the default decision is to wait until morning."
  status: "stable"
  check: 
    kind: "static_manifest"
    expr: "exists(agent.owner.accountable) and len(agent.owner.accountable) >= 3"
    message: "agent.owner.accountable is missing or too short to be a person's name."
  evidence: 
    - "manifest_field"
  remediation: "Name the individual who would be paged. If nobody would be, the agent is not ready for the stage it claims."
  standard_ref: "standards/01-agent-contract.md#controlaiagentowner_defined"
  references: 
    - "NIST AI RMF GOVERN 2.1"
    - "ISO/IEC 42001:2023 5.3"
