schema_version: "1.0"
control:
  id: "control.ai.agent.scope_declared"
  type: "agent"
  title: "Every agent declares what it must refuse"
  intent: "A capable model asked to do something adjacent to its purpose will usually try, and produce something plausible. The boundary has to be decided in advance, in writing."
  status: "stable"
  check: 
    kind: "static_manifest"
    expr: "exists(agent.out_of_scope) and len(agent.out_of_scope) >= 1"
    message: "agent.out_of_scope is empty. An agent never told what to refuse will attempt it."
  evidence: 
    - "manifest_field"
  remediation: "Write the three things you would be most alarmed to find it had done, then mirror them into the refusal section of the system prompt."
  standard_ref: "standards/01-agent-contract.md#controlaiagentscope_declared"
  references: 
    - "OWASP LLM06"
