schema_version: "1.0"
control:
  id: "control.ai.agent.budget_bounded"
  type: "agent"
  title: "Cost and latency have a declared ceiling"
  intent: "A declared budget is what a cost alert and a denial-of-wallet detection are built from."
  status: "stable"
  check: 
    kind: "static_manifest"
    expr: "exists(agent.autonomy.budget.usd_per_run) or exists(agent.autonomy.budget.tokens_per_run)"
    message: "No cost or token budget is declared for a run."
  evidence: 
    - "manifest_field"
  remediation: "Set autonomy.budget.usd_per_run and tokens_per_run from an observed p95, then alert above it."
  standard_ref: "standards/01-agent-contract.md#controlaiagentbudget_bounded"
  references: 
    - "OWASP LLM10"
