schema_version: "1.0"
control:
  id: "control.ai.agent.stop_conditions"
  type: "agent"
  title: "The agent loop provably terminates"
  intent: "An unbounded loop is not an occasional bug: it is an unbounded cost and an unbounded blast radius that happen to have been small so far."
  status: "stable"
  check: 
    kind: "static_manifest"
    expr: "agent.autonomy.max_steps > 0 and exists(agent.autonomy.max_tool_calls) and len(agent.autonomy.stop_conditions) >= 1"
    message: "max_steps, max_tool_calls and at least one stop condition are all required."
  evidence: 
    - "manifest_field"
  remediation: "Express stop conditions as observable states \u2014 'answer delivered with a citation' \u2014 not as intentions like 'the task is done'."
  standard_ref: "standards/01-agent-contract.md#controlaiagentstop_conditions"
  references: 
    - "OWASP LLM10"
