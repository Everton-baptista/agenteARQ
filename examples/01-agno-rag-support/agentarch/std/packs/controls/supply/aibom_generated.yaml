schema_version: "1.0"
control:
  id: "control.ai.supply.aibom_generated"
  type: "supply"
  title: "An AI bill of materials is generated"
  intent: "An SBOM omits the model, the prompt, the corpus and the MCP servers, which is most of what determines how an agent behaves."
  status: "stable"
  check:
    kind: "static_manifest"
    expr: "exists(agent.model.id) and exists(agent.prompts.system.sha256)"
    message: "The manifest lacks the fields an AI-BOM is generated from."
  evidence:
    - "file_hash"
  remediation: "Run `agentarch aibom --out ai-bom.json` in CI so it cannot drift from the manifests."
  standard_ref: "standards/15-supply-chain.md#controlaisupplyaibom_generated"
  references:
    - "CycloneDX"
    - "SLSA"
