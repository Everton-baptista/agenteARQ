schema_version: '1.0'
control:
  id: control.ai.api.secrets_not_committed
  type: api
  title: No environment file with secret values is tracked
  intent: Invariant 3 says a secret is referenced by name and never carried by value. The single most common way
    that breaks is `git add -A` on a day somebody is in a hurry, and a credential in git history outlives the commit
    that removed it.
  status: experimental
  check:
    kind: static_manifest
    expr: len(repository.tracked_secret_files) == 0
    message: A tracked environment file carries secret values. Delete it, ignore it, and rotate the credential —
      it is public.
  evidence:
  - repository_scan
  - lint_result
  remediation: Rotate the credential first — it is public. Then delete the file, add it to the ignore list, and
    commit an example that declares names and assigns no values.
  standard_ref: standards/16-service-and-edge.md#controlaiapisecretsnotcommitted
  references:
  - OWASP LLM02
