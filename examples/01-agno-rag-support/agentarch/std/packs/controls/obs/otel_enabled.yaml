schema_version: "1.0"
control:
  id: "control.ai.obs.otel_enabled"
  type: "obs"
  title: "Telemetry is emitted through OpenTelemetry"
  intent: "Without a trace per invocation, a failure in production is a report that something felt wrong, with nothing to look at."
  status: "stable"
  check:
    kind: "static_manifest"
    expr: "agent.observability.otel.enabled == true"
    message: "OpenTelemetry is not enabled for this agent."
  evidence:
    - "manifest_field"
  remediation: "Set observability.otel.enabled and emit a span per invocation, per tool call and per retrieval."
  standard_ref: "standards/12-observability.md#controlaiobsotel_enabled"
  references:
    - "NIST AI RMF MEASURE 2.1"
