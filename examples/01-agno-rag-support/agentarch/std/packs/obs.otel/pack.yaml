schema_version: "1.0"
pack:
  id: obs.otel
  version: 1.0.0
  title: OpenTelemetry GenAI semantic conventions
  description: >-
    Telemetry that another tool can read, with the semantic-convention version pinned. The GenAI
    conventions are still moving; an unpinned integration silently changes what your dashboards
    mean.

  authority_status: voluntary_standard
  authority:
    name: OpenTelemetry semantic conventions for generative AI
    reference: OpenTelemetry Authors
    jurisdiction: ["*"]
    url: https://opentelemetry.io/docs/specs/semconv/gen-ai/
  reviewed_at: "2026-07-28"

  requires:
    - control: control.ai.obs.otel_enabled
      severity: major
      required_evidence: [manifest_field]

    - control: control.ai.obs.semconv_pinned
      severity: major
      required_evidence: [manifest_field]

    - control: control.ai.privacy.capture_content_default_off
      severity: blocker
      required_evidence: [manifest_field, test_result]
      note: >-
        Blocker even here. Telemetry is the single easiest place to accidentally build a
        complete, long-lived copy of every conversation, under different access rules from the
        system that was reviewed.

        Evidenced by a test as well as the field, because this one is genuinely checkable: assert
        that a captured span export contains no prompt or response body. A manifest saying
        capture_content is false and an exporter that captures it anyway is exactly the gap this
        pack exists to close.
