# Freshness is measured from here. A result with no date cannot be fresh, and a stale one
# describes a system that may no longer exist.
# ─────────────────────────────────────────────────────────────────────────────────────────────
# NOTHING HERE HAS BEEN MEASURED. This file is a placeholder.
#
# It ships as a placeholder rather than with example numbers because an earlier version carried
# plausible ones, and every one of them was invented — the datasets they referenced did not exist.
# `agentarch conformance` read them and reported **L3 Proven** for a project one minute old.
#
# That is the conformance theatre this standard exists to prevent, committed by the standard itself,
# in the first artifact a new user is handed. A plausible wrong number is worse than a blank one:
# nobody re-examines a field that is already filled in.
#
# `status: not_run` is the honest state, and the gate does not punish you for it. The eval controls
# only judge a result that claims to have been measured. What you lose is credit, not the build —
# conformance reports L2 and names this file as what stands between you and L3.
#
# To make it real: build the datasets, run `python evals/run.py`, and it writes the measured values
# and sets status: measured. Nothing else can.
# ─────────────────────────────────────────────────────────────────────────────────────────────

