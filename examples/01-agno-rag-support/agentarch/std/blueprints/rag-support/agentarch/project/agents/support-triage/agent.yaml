schema_version: "1.0"
agent:
  id: support-triage
  name: Customer support triage
  owner:
    team: customer-support
    contact: support-eng@example.com
    accountable: alex.moreau

  stage: pilot
  system_type: generative_rag
  purpose: >-
    Answers customer questions about orders and returns from the public help centre,
    and escalates anything it cannot ground in a cited source.
  out_of_scope:
    - Never issues a refund, credit or goodwill gesture
    - Never promises a delivery date not returned by the order lookup tool
    - Never discusses another customer's order

  users:
    audience: external
    minors_likely: false
  jurisdictions: ["EU", "BR"]
  languages: ["en", "pt-BR"]

  autonomy:
    level: L1_act_with_approval
    max_steps: 8
    max_tool_calls: 12
    stop_conditions:
      - Answer delivered with at least one citation
      - Escalated to a human agent
      - Step or cost budget exhausted
    budget:
      usd_per_run: 0.15
      # The bound per-run limits cannot express. Enforced in the layer that resolved the caller's
      # identity, because that is the only place that knows who the caller is.
      runs_per_caller_per_day: 200
      tokens_per_run: 40000
      latency_p95_ms: 6000

  model:
    provider: anthropic
    id: claude-sonnet-4-5-20250929
    pinned: true
    params:
      temperature: 0.2
      max_output_tokens: 1200

  prompts:
    system:
      path: prompts/system.v1.md
      version: 1.0.0
      sha256: "8172c8682dec4d684edd873776ab1b2709a4ad8fa8d60c075798af797e232b6b"
    variables:
      - name: customer_tier
        source: app
        trusted: true
      - name: question
        source: user
        trusted: false

  context:
    rag:
      enabled: true
      corpus_id: help-centre-public
      corpus_version: "2026-07-01"
      top_k: 6
      citation_required: true
      untrusted: true
    memory:
      kind: session
      ttl_days: 1
      scope_key: conversation_id
      pii_allowed: false

  tools:
    - ref: ../../tools/search_orders.tool.yaml
      approval: none
      rate_limit:
        rpm: 60
    - ref: ../../tools/notify_customer.tool.yaml
      approval: human

  mcp:
    allowlist_ref: ../../mcp/allowlist.yaml
    servers_used: [help-centre-docs]

  guardrails:
    input:
      - control: control.ai.genai.prompt_injection
        fail_mode: fail_closed
    output:
      - control: control.ai.privacy.pii_leakage
        fail_mode: fail_closed
      - control: control.ai.rag.citation_required
        fail_mode: fail_warn
        note: A missing citation degrades to escalation rather than blocking the reply.
    action:
      - control: control.ai.tool.least_privilege
        fail_mode: fail_closed

  privacy:
    processes_personal_data: true
    data_categories: [contact, transactional]
    legal_basis: contract_performance
    capture_content: false
    redaction:
      enabled: true
      profile: pii_default_v1
    retention_days: 30


  # ── the edge ────────────────────────────────────────────────────────────────────────────────
  # How callers reach this agent. contracts/openapi.json is generated from here by `agentarch sync`,
  # so this block is the reviewed source and the JSON is the derivative — the same relationship
  # .mcp.json has with the MCP allowlist.
  interface:
    transport: http
    base_path: /v1

    caller:
      # The tenant is read from a verified token claim, server-side. Declaring it is what makes the
      # memory scope_key below a scope rather than a parameter: a key the caller can set isolates
      # nothing, and two tenants end up sharing one store while every control still passes.
      identified_by: bearer_jwt
      tenant_claim: tenant_id
      verified_server_side: true

    logging:
      # Where privacy.capture_content either holds or is a lie. A web framework logs request paths by
      # default and an unhandled error records whatever was in scope — which is how personal data
      # reaches a log aggregator with a multi-year retention and no subject-access path, on the day
      # the service ships, silently.
      capture_request_body: false
      capture_response_body: false
      log_route_template_only: true
      redact: [authorization, cookie, x-api-key, proxy-authorization]

    routes:
      - path: /health
        method: GET
        summary: Readiness. Verifies the credential resolves and the prompt still matches the manifest.
        auth_required: false
        idempotent: true
      - path: /ask
        method: POST
        summary: Ask one question. Returns an answer with citations, an escalation, or a pending approval.
        request_schema: app/api/schemas.py#AskRequest
        response_schema: app/api/schemas.py#AskResponse
        auth_required: true
        idempotent: false
      - path: /approvals/{approval_id}
        method: POST
        summary: Record a human decision on a paused irreversible action.
        request_schema: app/api/schemas.py#ApprovalDecision
        response_schema: app/api/schemas.py#AskResponse
        auth_required: true
        # Not idempotent, and deliberately so: a decision is consumed. Replaying an approval replays
        # the irreversible action it authorised.
        idempotent: false

  observability:
    otel:
      enabled: true
      semconv_version: "1.29.0"
      capture_content: false
    slo:
      availability: 0.99
      latency_p95_ms: 6000
      task_success_rate: 0.85

  evaluation:
    plan_ref: evals/plan.yaml
    last_result_ref: evals/results/latest.yaml
    max_result_age_days: 30

  policy:
    packs: ["core.agent.v1", "sec.owasp-llm.v1", "obs.otel.v1"]
    waivers_ref: ../../waivers.yaml

  lifecycle:
    revalidate_on:
      - model_changed
      - system_prompt_changed
      - rag_corpus_changed
      - provider_changed
      - tool_added
      - autonomy_raised
      - guardrail_disabled
    last_validated_at: "2026-07-20"
    review_interval_days: 90

  links:
    threat_model: threat-model.md
    model_card: model-card.md
    runbook: runbook.md
