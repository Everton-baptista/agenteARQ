schema_version: "1.0"
tool:
  id: check_service_status
  description_for_model: >-
    Report the current operational status of one service component: api, dashboard or
    webhooks. Returns the state and the time it was last verified. Does not modify anything.
  description_for_humans: >-
    Read-only status lookup against the company's own status endpoint. Takes a component
    name, never an identifier from the conversation, so there is nothing to scope or inject.

  input_schema:
    type: object
    required: [component]
    additionalProperties: false
    properties:
      component:
        type: string
        enum: [api, dashboard, webhooks]

  output_schema:
    type: object
    required: [component, state]
    properties:
      component: { type: string }
      state: { type: string }
      verified_at: { type: string }

  effect: read
  idempotency:
    idempotent: true

  permissions:
    scopes: ["status:read"]
    data_access: ["service_status"]
    network:
      deny_by_default: true
      egress: ["status.internal.example.com"]
    filesystem:
      read: []
      write: []
    secrets: ["STATUS_API_TOKEN"]
    sandbox: subprocess

  limits:
    timeout_ms: 2000
    max_retries: 2
    rate_limit_rpm: 60

  failure:
    on_timeout: fail_warn
    on_error: fail_warn

  owner: team-platform
  tests:
    - tests/tools/test_check_service_status.py
