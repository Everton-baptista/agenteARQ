# Deployment, Service and HPA. See deploy/README.md for the reasoning; the comments here mark the
# lines that are security or correctness properties rather than defaults.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-support
  labels: { app: rag-support }
spec:
  replicas: 2
  selector:
    matchLabels: { app: rag-support }
  template:
    metadata:
      labels: { app: rag-support }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/your-org/rag-support:1.0.0   # by digest in production, not by tag
          ports: [{ containerPort: 8000 }]
          env:
            - name: ENV
              value: production
            # The credential by reference, never a literal. A value here is a value in git.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: rag-support, key: ANTHROPIC_API_KEY }
            # Two replicas means the in-memory approval store is a bug: an approval raised by one
            # pod is a 404 at the other.
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: { name: rag-support, key: REDIS_URL }
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability:4318
          # Readiness and liveness are deliberately different checks. When the provider circuit is
          # open the pod is unready — it should stop receiving traffic — but it must not be killed,
          # because a restart loses every pending approval it is holding.
          readinessProbe:
            httpGet: { path: /v1/health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            # A limit, because an agent retrying under memory pressure gets OOM-killed mid-run and
            # the caller sees a connection reset instead of an error they can act on.
            limits: { cpu: 1000m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rag-support
spec:
  selector: { app: rag-support }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rag-support
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: rag-support }
  minReplicas: 2
  # An upper bound is a cost bound. Autoscaling an agent without one turns a traffic spike into an
  # invoice nobody approved.
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
