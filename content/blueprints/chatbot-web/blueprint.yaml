id: chatbot-web
title: Customer-facing web chat with human approval in the browser
need: A chat on my website that answers customers, with a human approving the risky actions
system_type: generative_rag
provider: anthropic
conformance: L2

description: >-
  A governed chat agent with its own web page. The browser talks only to the service — never to
  the model provider — so every guardrail, budget and audit trail stays server-side, and the page
  carries no credential anyone can view-source their way into.

  The chat UI is one static page with no build step: a token field standing in for your SSO, a
  message list, and an approval card that appears when the agent pauses on an irreversible action,
  so the whole HITL loop is visible end to end in the browser. Vanilla HTML and JS, served by the
  same FastAPI app that serves the API — no Node toolchain, no CDN, nothing to build.

  The parts worth reading first are web/chat.js — where the only fetch targets are /v1/ask and
  /v1/approvals/{id} — and app/api/main.py, where the page is served and the docs console is off
  outside development.

frameworks: [none]

demonstrates:
  - A web client that calls only the service's own API, with no provider SDK, key or hostname in it
  - Demo auth done honestly — the page asks for a token, keeps it in sessionStorage, ships none
  - Human-in-the-loop end to end — the paused action renders as an approval card in the chat
  - A static page with no build step and no third-party CDN, served by the governed service
  - Guardrails at all three points, with the action check never consulting the model
