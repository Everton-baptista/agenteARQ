# MCP allowlist. This is the reviewed document; .mcp.json is generated from it by
# `agentarch sync`, so there is one source rather than two files that agree until one is edited.
schema_version: "1.0"

# Only one legal value. An allowlist that defaults to allow is a list, not an allowlist.
default: deny

servers:
  - name: help-centre-docs
    description: >-
      Read-only access to the published help centre corpus. Serves the passages the triage
      agent grounds its answers in.
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem@2026.6.1", "/srv/help-centre"]
    pin:
      package: "@modelcontextprotocol/server-filesystem"
      version: "2026.6.1"
      integrity: "sha256-3f9a1c7d5e2b48a0c6d1f4e8b2a9c5d7e0f3a6b8c1d4e7f0a3b6c9d2e5f8a1b4"

    trust: vendor_reviewed
    reviewed_at: "2026-07-20"
    reviewer: alex.moreau

    # Exactly what this project accepts. A tool the server starts offering later is refused
    # until someone reviews it, which is a decision with a date and a name against it.
    tools_allow: [read_file, list_directory]
    tools_deny: [write_file, move_file, create_directory, edit_file]

    # What each description said when it was read. This is the defence against a rug pull: a
    # server can serve a benign description during review and a hostile one afterwards, and
    # nothing else in the protocol would notice, because descriptions carry no version.
    tool_description_sha256:
      read_file: "8a1f4c9e2b7d0a3f6c9e2b5d8a1f4c7e0b3d6a9c2f5e8b1d4a7c0f3e6b9d2a5c"
      list_directory: "2c5f8b1e4a7d0c3f6b9e2d5a8c1f4b7e0a3d6c9f2b5e8a1d4c7f0b3e6a9d2c5f"

    resources_allow: ["file:///srv/help-centre/**"]
    prompts_allow: []

    # Only what it needs. A server inheriting the process environment inherits every
    # credential in it.
    env_allow: [HELP_CENTRE_ROOT]
    network_egress: []
    requires_human_approval: false
    sandbox: container
