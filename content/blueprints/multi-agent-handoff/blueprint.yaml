id: multi-agent-handoff
title: Orchestrator with specialists and a typed handoff
need: Several agents working together without losing track of who may do what
system_type: multi_agent
provider: anthropic
conformance: L2

description: >-
  An orchestrator that delegates to specialists with a typed payload, a declared authority, a return point and a timeout. Authority does not travel with the message: the receiving agent gets the tools its own manifest declares, which is what stops an orchestrator that can issue refunds from making everything it delegates to able to. The budget is shared across the system — three agents with ten steps each is a system with thirty.

frameworks: [none]

demonstrates:
  - "A handoff contract: typed payload, declared authority, return point, timeout"
  - Authority that does not transfer with the message
  - A step budget shared across the system rather than per agent
  - Cycle detection, which no per-agent limit catches
  - Another agent's output treated as untrusted content
