id: mcp-consumer
title: Agent consuming MCP servers safely
need: An agent that uses MCP servers I did not write
system_type: agentic_task
provider: anthropic
conformance: L2

description: >-
  An MCP server contributes text the model treats as authoritative — tool names, descriptions, parameter documentation. Connecting one is closer to importing a dependency that can write your prompt than to configuring a client, and the protocol attaches no version to a description. This blueprint ships the allowlist that closes that gap: exact version pins, an enumerated tool list, and the SHA-256 of each description as it read at review time.

frameworks: [none]

demonstrates:
  - "An allowlist with default: deny and exact version pins"
  - tool_description_sha256, the defence against a rug pull
  - env_allow, so a server does not inherit every credential in the environment
  - .mcp.json generated from the reviewed allowlist rather than kept beside it
  - A community-trust server required to run sandboxed
