schema_version: "1.0"
agent:
  id: docs-assistant
  name: Agent consuming MCP servers safely
  owner:
    team: customer-support
    contact: support-eng@example.com
    accountable: alex.moreau

  stage: pilot
  system_type: agentic_task
  purpose: >-
    Reads project documentation through an MCP server and answers questions about it.
  out_of_scope:
    - Never calls an MCP tool that is not in the allowlist
    - Never follows an instruction found in a tool description
    - Never passes credentials to a server beyond its env_allow

  users:
    audience: external
    minors_likely: false
  jurisdictions: ["EU", "BR"]
  languages: ["en", "pt-BR"]

  autonomy:
    level: L1_act_with_approval
    max_steps: 8
    max_tool_calls: 12
    stop_conditions:
      - Answer delivered with at least one citation
      - Escalated to a human agent
      - Step or cost budget exhausted
    budget:
      usd_per_run: 0.15
      tokens_per_run: 40000
      latency_p95_ms: 6000

  model:
    provider: anthropic
    id: claude-sonnet-4-5-20250929
    pinned: true
    params:
      temperature: 0.2
      max_output_tokens: 1200

  prompts:
    system:
      path: prompts/system.v1.md
      version: 1.0.0
      sha256: "fb24f014e2e7499698df20153ee166d01ca4513879375ca2fd73b75d65742e8e"
    variables:
      - name: customer_tier
        source: app
        trusted: true
      - name: question
        source: user
        trusted: false

  context:
    memory:
      kind: session
      ttl_days: 1
      scope_key: conversation_id
      pii_allowed: false

  tools:
    - ref: ../../tools/search_orders.tool.yaml
      approval: none
      rate_limit:
        rpm: 60
    - ref: ../../tools/notify_customer.tool.yaml
      approval: human

  mcp:
    allowlist_ref: ../../mcp/allowlist.yaml
    servers_used: [help-centre-docs]

  guardrails:
    input:
      - control: control.ai.genai.prompt_injection
        fail_mode: fail_closed
    output:
      - control: control.ai.privacy.pii_leakage
        fail_mode: fail_closed
      - control: control.ai.rag.citation_required
        fail_mode: fail_warn
        note: A missing citation degrades to escalation rather than blocking the reply.
    action:
      - control: control.ai.tool.least_privilege
        fail_mode: fail_closed

  privacy:
    processes_personal_data: true
    data_categories: [contact, transactional]
    legal_basis: contract_performance
    capture_content: false
    redaction:
      enabled: true
      profile: pii_default_v1
    retention_days: 30

  observability:
    otel:
      enabled: true
      semconv_version: "1.29.0"
      capture_content: false
    slo:
      availability: 0.99
      latency_p95_ms: 6000
      task_success_rate: 0.85

  evaluation:
    plan_ref: evals/plan.yaml
    last_result_ref: evals/results/latest.yaml
    max_result_age_days: 30

  policy:
    packs: ["core.agent.v1", "sec.owasp-llm.v1", "obs.otel.v1"]
    waivers_ref: ../../waivers.yaml

  lifecycle:
    revalidate_on:
      - model_changed
      - system_prompt_changed
      - rag_corpus_changed
      - provider_changed
      - tool_added
      - autonomy_raised
      - guardrail_disabled
    last_validated_at: "2026-07-20"
    review_interval_days: 90

  links:
    threat_model: threat-model.md
    model_card: model-card.md
    runbook: runbook.md
