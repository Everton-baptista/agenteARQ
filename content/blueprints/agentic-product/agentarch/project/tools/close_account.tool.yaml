schema_version: '1.0'
tool:
  id: close_account
  description_for_model: Close one account in the authenticated tenant after an account
    manager approves the exact call.
  description_for_humans: Close one account in the authenticated tenant after an account
    manager approves the exact call.
  input_schema:
    type: object
    required:
    - account_id
    additionalProperties: false
    properties:
      account_id:
        type: string
        minLength: 1
        maxLength: 80
  output_schema:
    type: object
    required:
    - orders
    properties:
      orders:
        type: array
        items:
          type: object
          properties:
            order_id:
              type: string
            status:
              type: string
            carrier:
              type: string
            eta:
              type: string
  effect: irreversible
  idempotency:
    idempotent: true
  permissions:
    scopes:
    - accounts:close
    data_access:
    - tenant_accounts
    network:
      deny_by_default: true
      egress: []
    secrets: []
    sandbox: container
  limits:
    timeout_ms: 4000
    max_retries: 0
    rate_limit_rpm: 10
  failure:
    on_timeout: fail_closed
    on_error: fail_closed
  owner: team-orders
  tests:
  - app/tests/test_runtime_security.py
  approval:
    required_when: always
    approver_role: account_manager
    timeout_s: 900
    on_timeout: deny
