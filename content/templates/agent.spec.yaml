# Agent manifest. This is the contract: if behaviour and manifest disagree, one of them is a bug.
#
# Written by `agentarch new agent <id>`. Fields marked REQUIRED will fail `agentarch validate`
# until you fill them in — that is deliberate. A manifest full of plausible defaults is worse
# than one that refuses to validate, because it looks finished.
#
# Run `agentarch validate` as you go, and `agentarch explain <control.id>` when something fails.

schema_version: "1.0"
agent:
  id: {{ID}}
  name: {{ID}}

  owner:
    team: TODO
    contact: TODO@example.com
    # REQUIRED. A named person, not a queue or a team alias. When this agent misbehaves at 3am,
    # this is who decides whether to switch it off.
    accountable: TODO

  stage: prototype              # prototype | internal | pilot | production
  system_type: agentic_task     # generative_chat | generative_rag | agentic_task |
                                # agentic_workflow | multi_agent | classifier

  # REQUIRED. One sentence: what it does and for whom.
  purpose: TODO

  # REQUIRED, at least one entry. What this agent must refuse.
  #
  # Write the three things you would be most alarmed to find it had done, then mirror them into
  # the refusal section of the system prompt. A capable model asked to do something adjacent to
  # its purpose will usually try, and produce something plausible.
  out_of_scope:
    - TODO

  users:
    audience: internal          # internal | external | public
    minors_likely: false

  # Selects which reg.* packs apply. ISO 3166-1 alpha-2, or EU.
  jurisdictions: {{JURISDICTIONS}}
  languages: ["en"]

  autonomy:
    # L0_suggest | L1_act_with_approval | L2_act_reversible |
    # L3_act_irreversible_bounded | L4_autonomous
    #
    # This is a property of the deployment, not of the model. The same prompt at L1 and at L4 is
    # two different systems with two different threat models.
    level: L1_act_with_approval

    max_steps: 8
    max_tool_calls: 12
    # Observable states, not intentions. "The task is done" is the agent's own judgement, which
    # is the thing under test.
    stop_conditions:
      - TODO
    budget:
      usd_per_run: 0.25
      tokens_per_run: 40000
      latency_p95_ms: 8000

  model:
    provider: TODO
    id: TODO
    # A floating alias changes behaviour under you with nothing in the repository to review.
    pinned: true
    params:
      temperature: 0.2

  prompts:
    system:
      path: prompts/system.v1.md
      version: 1.0.0
      # Filled in by `agentarch new agent`. Re-hash and bump the version whenever you edit the
      # prompt: AA-REF-004 checks this on every run, because a prompt edited without a version
      # bump is an invisible behaviour change.
      sha256: "{{PROMPT_SHA256}}"
    variables:
      - name: user_input
        source: user
        trusted: false          # only values your own code produced are trusted

  guardrails:
    # All three keys are required. An empty list records that you considered the point and chose
    # nothing; a missing key is indistinguishable from never having thought about it.
    input:
      - control: control.ai.genai.prompt_injection
        fail_mode: fail_closed
    output:
      - control: control.ai.privacy.pii_leakage
        fail_mode: fail_closed
    action:
      - control: control.ai.tool.least_privilege
        fail_mode: fail_closed

  privacy:
    processes_personal_data: false
    # Required once processes_personal_data is true:
    # data_categories: [contact]
    # legal_basis: TODO
    # retention_days: 30
    capture_content: false
    redaction:
      enabled: true

  observability:
    otel:
      enabled: true
      semconv_version: "1.29.0"   # pinned; the GenAI conventions are still moving
      capture_content: false
    slo:
      availability: 0.99
      latency_p95_ms: 8000
      task_success_rate: 0.85

  evaluation:
    plan_ref: evals/plan.yaml
    max_result_age_days: 30

  policy:
    packs: []                     # the profile's packs apply automatically; add extras here
    waivers_ref: ../../waivers.yaml

  lifecycle:
    revalidate_on:
      - model_changed
      - system_prompt_changed
      - provider_changed
      - tool_added
      - autonomy_raised
      - guardrail_disabled
      - mcp_server_added
    last_validated_at: "{{TODAY}}"
    review_interval_days: 90

  links:
    threat_model: threat-model.md
    runbook: runbook.md
