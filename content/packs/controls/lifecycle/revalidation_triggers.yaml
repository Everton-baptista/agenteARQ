schema_version: "1.0"
control:
  id: "control.ai.lifecycle.revalidation_triggers"
  type: "lifecycle"
  title: "The agent declares what invalidates its assurance"
  intent: "Each trigger has a victim: an eval result, a threat model, an approval \u2014 all describing the system as it was before the change."
  status: "stable"
  check:
    kind: "static_manifest"
    expr: "exists(agent.lifecycle.revalidate_on) and len(agent.lifecycle.revalidate_on) >= 1"
    message: "lifecycle.revalidate_on is empty, so no change is treated as invalidating."
  evidence:
    - "manifest_field"
  remediation: "List the triggers that apply. At minimum model_changed, system_prompt_changed and autonomy_raised."
  standard_ref: "standards/14-lifecycle.md#controlailifecyclerevalidation_triggers"
  references:
    - "NIST AI RMF MANAGE 4.1"
