schema_version: "1.0"
control:
  id: "control.ai.eval.gate_thresholds"
  type: "eval"
  title: "Some metric actually blocks a release"
  intent: "A plan that measures everything and blocks on nothing is a dashboard."
  status: "stable"
  check:
    kind: "static_manifest"
    expr: 'evals.status != "measured" or any(evals.metrics[].passed != null)'
    message: "No evaluation metric is wired to the gate."
  evidence:
    - "eval_result"
  remediation: "Name the blocking metrics in gate.block_on, and prefer deterministic ones."
  standard_ref: "standards/11-evaluation.md#controlaievalgate_thresholds"
  references:
    - "NIST AI RMF MEASURE 2.1"

# Conditional on `status: measured` on purpose. A project that has honestly not run its evals is
# not lying about anything, and failing its build teaches it to write plausible numbers instead —
# which is exactly what happened to the blueprint that used to ship groundedness 0.94 against a
# dataset that did not exist. The gate blocks a false claim; the badge withholds credit. Absence
# of evidence costs you L3, not the build.
