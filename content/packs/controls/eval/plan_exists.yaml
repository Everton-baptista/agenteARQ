schema_version: "1.0"
control:
  id: "control.ai.eval.plan_exists"
  type: "eval"
  title: "An evaluation plan exists"
  intent: "Thresholds written before the numbers exist are a judgement about acceptable behaviour. Written afterwards they describe whatever the system scored."
  status: "stable"
  check:
    kind: "static_manifest"
    expr: "exists(agent.evaluation.plan_ref)"
    message: "No evaluation plan is referenced."
  evidence:
    - "eval_result"
  remediation: "Write evals/plan.yaml naming datasets, metrics, thresholds and what blocks a release."
  standard_ref: "standards/11-evaluation.md#controlaievalplan_exists"
  references:
    - "NIST AI RMF MEASURE 1.1"
