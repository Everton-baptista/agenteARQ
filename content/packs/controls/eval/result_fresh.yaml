schema_version: "1.0"
control:
  id: "control.ai.eval.result_fresh"
  type: "eval"
  title: "The evaluation result is within its freshness window"
  intent: "A stale result describes a system that may no longer exist, which is worse than no result because it reads as assurance."
  status: "stable"
  check:
    kind: "static_manifest"
    expr: 'evals.status != "measured" or (exists(evals.completed_at) and age_days(evals.completed_at) <= agent.evaluation.max_result_age_days)'
    message: "The evaluation result is missing or older than max_result_age_days."
  evidence:
    - "eval_result"
  remediation: "Re-run the evals. Extending the window instead is how a freshness control stops meaning anything."
  standard_ref: "standards/11-evaluation.md#controlaievalresult_fresh"
  references:
    - "NIST AI RMF MEASURE 2.3"

# Conditional on `status: measured` on purpose. A project that has honestly not run its evals is
# not lying about anything, and failing its build teaches it to write plausible numbers instead —
# which is exactly what happened to the blueprint that used to ship groundedness 0.94 against a
# dataset that did not exist. The gate blocks a false claim; the badge withholds credit. Absence
# of evidence costs you L3, not the build.
