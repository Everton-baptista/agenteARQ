schema_version: "1.0"
control:
  id: "control.ai.eval.dataset_versioned"
  type: "eval"
  title: "Every evaluation dataset is hashed"
  intent: "Without a hash, a quietly edited dataset makes a regression look like an improvement and nobody can say which run the numbers came from."
  status: "stable"
  check:
    kind: "static_manifest"
    expr: 'evals.status != "measured" or all(evals.datasets[].sha256 != null)'
    message: "An evaluation dataset has no recorded hash."
  evidence:
    - "eval_result"
  remediation: "Record sha256 and a case count per dataset. Two results are only comparable against the same cases."
  standard_ref: "standards/11-evaluation.md#controlaievaldataset_versioned"
  references:
    - "NIST AI RMF MEASURE 2.3"

# Conditional on `status: measured` on purpose. A project that has honestly not run its evals is
# not lying about anything, and failing its build teaches it to write plausible numbers instead —
# which is exactly what happened to the blueprint that used to ship groundedness 0.94 against a
# dataset that did not exist. The gate blocks a false claim; the badge withholds credit. Absence
# of evidence costs you L3, not the build.
