schema_version: "1.0"
control:
  id: "control.ai.tool.least_privilege"
  type: "tool"
  title: "Tools deny network egress by default"
  intent: "Assume the tool will be called with attacker-chosen arguments; the only useful question is what is reachable from there."
  status: "stable"
  check: 
    kind: "static_manifest"
    expr: "all(tools[].tool.permissions.network.deny_by_default == true)"
    message: "A tool does not deny network egress by default."
  evidence: 
    - "tool_spec"
    - "test_result"
  remediation: "Set deny_by_default: true and enumerate explicit hosts. Never widen a permission to make a failure go away \u2014 the failure is information about the task being wrong-shaped."
  standard_ref: "standards/03-tools.md#controlaitoolleast_privilege"
  references: 
    - "OWASP LLM06"
    - "MITRE ATLAS"
