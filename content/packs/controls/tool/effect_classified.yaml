schema_version: "1.0"
control:
  id: "control.ai.tool.effect_classified"
  type: "tool"
  title: "Every tool classifies its effect on the world"
  intent: "The effect determines approval, guardrails and blast radius; classifying it afterwards means the design was made without it."
  status: "stable"
  check: 
    kind: "static_manifest"
    expr: "all(tools[].tool.effect in [\"read\",\"write\",\"irreversible\",\"money\",\"communication\"])"
    message: "A tool has no valid effect classification."
  evidence: 
    - "tool_spec"
  remediation: "Classify before implementing. Note that communication is separate from write: undoing a write is a database operation, undoing a sent message is an apology."
  standard_ref: "standards/03-tools.md#controlaitooleffect_classified"
  references: 
    - "OWASP LLM06"
