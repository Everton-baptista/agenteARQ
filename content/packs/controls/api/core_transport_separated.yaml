schema_version: '1.0'
control:
  id: control.ai.api.core_transport_separated
  type: api
  title: The agent core does not depend on the transport
  intent: An agent that can only run inside a web server cannot be tested, reused from a worker, or moved — and
    the drift that gets it there is gradual and always locally reasonable.
  status: experimental
  applies_to:
    # No transport, no direction for the core to depend in.
    declares: [interface]
  check:
    kind: static_manifest
    expr: exists(config.layout.paths.core) and exists(config.layout.paths.edge)
    message: The layers are not declared, so the dependency direction between them cannot be checked.
  evidence:
  - config
  - lint_result
  - test_result
  remediation: Declare layout.paths.core and layout.paths.edge in agentarch.yaml. The lint AA-DEP-019 then reads
    imports under core and fails on any that reach into edge. Move what the handler needed into a value the core
    defines rather than importing the request.
  standard_ref: standards/16-service-and-edge.md#controlaiapicoretransportseparated
  references:
  - OWASP LLM06
