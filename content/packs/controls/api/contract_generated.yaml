schema_version: '1.0'
control:
  id: control.ai.api.contract_generated
  type: api
  title: The interface contract is generated from the manifest
  intent: Two hand-maintained descriptions of one interface diverge, and the consumer reads whichever is wrong.
    This control checks that a contract is declared and derived; whether the derived file is currently stale is
    `sync --check`, which exits 3 — a different failure from a gate block, and CI needs to route them differently.
  status: experimental
  applies_to:
    # The contract is generated from interface.routes; with no interface there is nothing to
    # generate and nothing for a consumer to read.
    declares: [interface]
  check:
    kind: file_exists
    expr: exists(config.layout.paths.contract)
    message: No generated interface contract is declared.
  evidence:
  - generated_artifact
  remediation: 'Declare interface.routes in the manifest and layout.paths.contract in agentarch.yaml, then run `agentarch
    sync`. Never edit the generated file: `sync --check` will report it as drift, and a contract edited by hand
    is one the manifest no longer describes.'
  standard_ref: standards/16-service-and-edge.md#controlaiapicontractgenerated
