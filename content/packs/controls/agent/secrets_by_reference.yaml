schema_version: "1.0"
control:
  id: "control.ai.agent.secrets_by_reference"
  type: "agent"
  title: "Secrets are referenced by name, never by value"
  intent: "A secret committed to a repository is disclosed to everyone who ever clones it, including after it is deleted."
  status: "stable"
  check: 
    kind: "static_manifest"
    expr: "all(tools[].tool.permissions.secrets[] != null)"
    message: "A tool declares a secret that does not look like an environment variable name."
  evidence: 
    - "tool_spec"
    - "scan_result"
  remediation: "Store the value in a secret manager and reference it by name. Rotate anything that was ever committed."
  standard_ref: "standards/01-agent-contract.md#controlaiagentsecrets_by_reference"
  references: 
    - "OWASP LLM02"
