schema_version: "1.0"
control:
  id: "control.ai.agent.autonomy_declared"
  type: "agent"
  title: "Autonomy is declared, not emergent"
  intent: "The same prompt deployed at L1 and at L4 is two different systems with two different threat models."
  status: "stable"
  check: 
    kind: "static_manifest"
    expr: "exists(agent.autonomy.level)"
    message: "agent.autonomy.level is not declared."
  evidence: 
    - "manifest_field"
  remediation: "Choose the level that matches the deployment, not the model's capability. Raising it later is a revalidation trigger."
  standard_ref: "standards/01-agent-contract.md#controlaiagentautonomy_declared"
  references: 
    - "OWASP LLM06"
