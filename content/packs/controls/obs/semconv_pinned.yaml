schema_version: "1.0"
control:
  id: "control.ai.obs.semconv_pinned"
  type: "obs"
  title: "The GenAI semantic convention version is pinned"
  intent: "The GenAI conventions are still moving. An unpinned integration changes what your dashboards mean without anyone editing a dashboard."
  status: "stable"
  check:
    kind: "static_manifest"
    expr: "not (agent.observability.otel.enabled == true) or exists(agent.observability.otel.semconv_version)"
    message: "Telemetry is enabled but no semconv_version is recorded."
  evidence:
    - "manifest_field"
  remediation: "Record the semantic-convention version you built against, and treat changing it as a deliberate migration."
  standard_ref: "standards/12-observability.md#controlaiobssemconv_pinned"
  references:
    - "OpenTelemetry GenAI semantic conventions"
