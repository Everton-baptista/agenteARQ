schema_version: "1.0"
control:
  id: "control.ai.supply.model_pinned"
  type: "supply"
  title: "The model is pinned to an immutable identifier"
  intent: "A floating alias changes behaviour with no diff, no review and no revalidation trigger, silently invalidating every eval and threat model downstream."
  status: "stable"
  check: 
    kind: "static_manifest"
    expr: "agent.model.pinned == true and not matches(agent.model.id, \"(latest|current|stable)$\")"
    message: "The model is not pinned, or its id ends in a floating alias."
  evidence: 
    - "manifest_field"
  remediation: "Set model.pinned: true and use an immutable identifier. Waive with an owner and an expiry if this is deliberately a prototype."
  standard_ref: "standards/15-supply-chain.md#controlaisupplymodel_pinned"
  references: 
    - "NIST AI RMF MAP 2.3"
