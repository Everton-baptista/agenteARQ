schema_version: "1.0"
pack:
  id: std.nist-ai-rmf
  version: 1.0.0
  title: NIST AI Risk Management Framework — Govern, Map, Measure, Manage
  description: >-
    A voluntary framework, mapped onto controls an artifact can evidence. Adopting this pack
    does not make an organisation's risk management adequate — the Framework is about
    organisational practice, and a manifest can only show the engineering half.

  authority_status: voluntary_standard
  authority:
    name: NIST AI Risk Management Framework 1.0
    reference: NIST AI 100-1
    jurisdiction: ["*"]
    url: https://www.nist.gov/itl/ai-risk-management-framework
  reviewed_at: "2026-07-28"

  requires:
    # GOVERN — accountability and documented policy.
    - control: control.ai.agent.owner_defined
      severity: blocker
      required_evidence: [manifest_field]
    - control: control.ai.agent.scope_declared
      severity: blocker
      required_evidence: [manifest_field]

    # MAP — context, components and their provenance.
    - control: control.ai.supply.model_pinned
      severity: blocker
      required_evidence: [manifest_field]
    - control: control.ai.rag.corpus_versioned
      severity: major
      required_evidence: [manifest_field]
    - control: control.ai.supply.aibom_generated
      severity: major
      required_evidence: [file_hash]

    # MEASURE — evaluation tied to intended use.
    - control: control.ai.eval.plan_exists
      severity: major
      required_evidence: [eval_result]
    - control: control.ai.eval.result_fresh
      severity: blocker
      required_evidence: [eval_result]
    - control: control.ai.eval.judge_not_sole_blocker
      severity: blocker
      required_evidence: [eval_result]

    # MANAGE — bounding consequences rather than only likelihood.
    - control: control.ai.tool.least_privilege
      severity: blocker
      required_evidence: [tool_spec, test_result]
    - control: control.ai.agent.stop_conditions
      severity: blocker
      required_evidence: [manifest_field]
    - control: control.ai.lifecycle.revalidation_triggers
      severity: major
      required_evidence: [manifest_field]
