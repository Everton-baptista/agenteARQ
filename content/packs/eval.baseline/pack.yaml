schema_version: "1.0"
pack:
  id: eval.baseline
  version: 1.0.0
  title: Evaluation baseline
  description: >-
    The minimum evidence that distinguishes a declared control from a working one. Every other
    pack can be satisfied by writing something down; this one cannot.

  authority_status: best_practice
  authority:
    name: agentarch
    reference: content/standards/en/11-evaluation.md
    jurisdiction: ["*"]
  reviewed_at: "2026-07-28"

  requires:
    - control: control.ai.eval.plan_exists
      severity: major
      required_evidence: [eval_result]

    - control: control.ai.eval.dataset_versioned
      severity: blocker
      required_evidence: [eval_result]

    - control: control.ai.eval.gate_thresholds
      severity: blocker
      required_evidence: [eval_result]

    - control: control.ai.eval.result_fresh
      severity: blocker
      required_evidence: [eval_result]

    - control: control.ai.eval.judge_not_sole_blocker
      severity: blocker
      required_evidence: [eval_result]

    - control: control.ai.eval.redteam_executed
      severity: major
      required_evidence: [eval_result]
