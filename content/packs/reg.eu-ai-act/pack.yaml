schema_version: "1.0"
pack:
  id: reg.eu-ai-act
  version: 1.0.0
  title: EU AI Act — engineering preconditions for transparency and risk management
  description: >-
    Controls that an agent's artifacts can evidence against the Act's obligations for
    record-keeping, transparency, human oversight and accuracy/robustness.

    Scope note, stated plainly: this pack does not classify your system. Whether an AI system is
    high-risk under Annex III, and which obligations therefore apply, is a legal determination
    about a use case — not something a manifest can infer. What is here are the engineering
    preconditions that a favourable assessment depends on, whichever tier you land in.

  authority_status: binding_law
  authority:
    name: Artificial Intelligence Act
    reference: "Regulation (EU) 2024/1689"
    jurisdiction: [EU]
    url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  reviewed_at: "2026-07-28"

  applies_when:
    jurisdictions: [EU]

  requires:
    # Record-keeping and technical documentation.
    - control: control.ai.supply.aibom_generated
      severity: major
      required_evidence: [file_hash]
      note: >-
        A generated bill of materials is the only version of technical documentation that stays
        true. One maintained by hand describes a system that used to exist.

    - control: control.ai.supply.model_pinned
      severity: blocker
      required_evidence: [manifest_field]
      note: Documentation about an unpinned model documents whatever ran that day.

    - control: control.ai.genai.prompt_versioned
      severity: blocker
      required_evidence: [manifest_field, file_hash]

    # Human oversight.
    - control: control.ai.tool.irreversible_requires_approval
      severity: blocker
      required_evidence: [manifest_field, tool_spec]

    - control: control.ai.agent.autonomy_declared
      severity: blocker
      required_evidence: [manifest_field]

    # Accuracy and robustness.
    - control: control.ai.eval.gate_thresholds
      severity: blocker
      required_evidence: [eval_result]

    - control: control.ai.eval.result_fresh
      severity: blocker
      required_evidence: [eval_result]

    - control: control.ai.eval.redteam_executed
      severity: major
      required_evidence: [eval_result]

    # Transparency towards the people affected.
    - control: control.ai.agent.scope_declared
      severity: blocker
      required_evidence: [manifest_field]
